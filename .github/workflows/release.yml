name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Upload wheel to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl

  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install package and PyInstaller
        run: pip install -e ".[dev]"

      - name: Build EXE
        run: pyinstaller fibutool.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" installer\fibutool.iss

      # Uncomment once a code signing certificate is configured:
      # - name: Sign installer
      #   run: >
      #     signtool sign
      #     /f certificate.pfx /p ${{ secrets.CERT_PASSWORD }}
      #     /tr http://timestamp.sectigo.com /td sha256 /fd sha256
      #     installer\Output\fibutool-setup-${{ steps.version.outputs.version }}.exe

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/fibutool.exe
            installer/Output/fibutool-setup-${{ steps.version.outputs.version }}.exe
