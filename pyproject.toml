[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "fibutool"
description = "Austrian bookkeeping PDF processor"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "pypdf>=4.0",
    "anthropic>=0.50",
    "pyyaml>=6.0",
    "reportlab>=4.0",
    "openpyxl>=3.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
    "keyring>=24.0",
]

[project.scripts]
# One-time setup:  pip install -e .
# Switch version:  git checkout v1.x.x && pip install -e .
# Verify:          fibutool --version
fibutool         = "run:main"           # orchestrator — normal entry point
fibutool-process = "process:main"       # processing layer only
fetcher          = "fetcher:main"       # acquisition layer only

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "setuptools-scm>=8.0", "pyinstaller>=6.0"]

[tool.setuptools]
# Flat layout: all modules are top-level .py files, no package subdirectory.
py-modules = [
    "api", "cache", "extractor", "fetcher", "journal", "journal_reader", "journal_updater",
    "matcher", "merger", "models", "orderer", "overview", "process", "run", "shared", "splitter",
]

[tool.setuptools_scm]
# Version is derived from git tags at install time.
# To cut a release:
#   git tag v1.0.0
#   git push origin v1.0.0
#   pip install -e .        ← reinstall so fibutool --version reflects the new tag

[tool.pytest.ini_options]
filterwarnings = [
  "ignore::pytest.PytestUnraisableExceptionWarning",
]